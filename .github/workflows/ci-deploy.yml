# Tests on every push and pull request. On main, also deploys to Cloudflare once the repo secrets are set
# (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BREVO_API_KEY, CODE_PEPPER.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Deploy only once all four secrets exist; until then, say which are missing and skip.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.BREVO_API_KEY != '' && secrets.CODE_PEPPER != '' }}
      MISSING: >-
        ${{ secrets.CLOUDFLARE_API_TOKEN == '' && 'CLOUDFLARE_API_TOKEN ' || '' }}${{ secrets.CLOUDFLARE_ACCOUNT_ID == '' && 'CLOUDFLARE_ACCOUNT_ID ' || '' }}${{ secrets.BREVO_API_KEY == '' && 'BREVO_API_KEY ' || '' }}${{ secrets.CODE_PEPPER == '' && 'CODE_PEPPER' || '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: 'echo "::warning::Deploy skipped. Missing repository secrets: $MISSING (see DEPLOY.md)."'
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v6
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci && npm run build
      - if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/worker
          wranglerVersion: '4.149.0'
          preCommands: npx wrangler d1 migrations apply jualanlab --remote
          command: deploy
          secrets: |
            BREVO_API_KEY
            CODE_PEPPER
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CODE_PEPPER: ${{ secrets.CODE_PEPPER }}
      - if: env.HAS_TOKEN == 'true'
        name: Optional secrets (only those that are set)
        working-directory: server/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOYYIB_SECRET: ${{ secrets.TOYYIB_SECRET }}
          UNTUNGLAB_ADMIN_TOKEN: ${{ secrets.UNTUNGLAB_ADMIN_TOKEN }}
          COMP_EMAILS: ${{ secrets.COMP_EMAILS }}
        run: |
          for name in TOYYIB_SECRET UNTUNGLAB_ADMIN_TOKEN COMP_EMAILS; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx wrangler secret put "$name"; else echo "$name not set (optional)"; fi
          done

