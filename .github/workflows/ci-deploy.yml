# Tests on every push and pull request. On main, also deploys to Cloudflare once the repo secrets are set
# (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BREVO_API_KEY, CODE_PEPPER.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "Cloudflare secrets not set yet; skipping deploy (see DEPLOY.md)."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci && npm run build
      - if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/worker
          wranglerVersion: '4.149.0'
          preCommands: npx wrangler d1 migrations apply jualanlab --remote
          command: deploy
          secrets: |
            BREVO_API_KEY
            CODE_PEPPER
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CODE_PEPPER: ${{ secrets.CODE_PEPPER }}
