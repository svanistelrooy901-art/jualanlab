# Cloudflare Worker for JualanLab: the app (static files) and its API on one origin. Steps in ../../DEPLOY.md.
name = "jualanlab"
main = "index.ts"
compatibility_date = "2026-10-01"

# Static app built by `npm run build` into dist/. Unknown paths serve index.html (the app's own router).
[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker sees every request first: the stores (Kedai) share this Worker on another host name. It hands the
# app's own files to ASSETS untouched.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "jualanlab"
database_id = "746fc61a-1529-456c-b655-98f2777a74a2"
migrations_dir = "../migrations"

[vars]
APP_ORIGINS = "https://jualan.untunglab.space"
GOOGLE_CLIENT_ID = ""                             # from Google Cloud Console; empty = Google sign-in off
BREVO_SENDER_EMAIL = "jualanlab@digitalsambal.space" # must be a verified sender in Brevo
BREVO_SENDER_NAME = "JualanLab"
PUBLIC_BASE_URL = "https://jualan.untunglab.space"
# Until launch (early November 2026): no new sign-ups except existing accounts and the COMP_EMAILS testers. Set to "0" at launch.
PRELAUNCH = "1"
# Sign-in and buying happen at the smeLab account service (DECISIONS A-01, A-05).
SMELAB_URL = "https://smelab.untunglab.space"
# The stores' public address (Kedai, DECISIONS K-03); served by this Worker on its own custom domain below.
KEDAI_URL = "https://kedai.untunglab.space"

# Secrets (never in this file):
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put CODE_PEPPER      (any long random string)

# The smeLab account service, privately (never over the internet). The "smelab" Worker deploys first.
[[services]]
binding = "SMELAB"
service = "smelab"
entrypoint = "SmeLabAccounts"

[[routes]]
pattern = "jualan.untunglab.space"
custom_domain = true

[[routes]]
pattern = "kedai.untunglab.space"
custom_domain = true

[observability]
enabled = true
