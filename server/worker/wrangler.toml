# Cloudflare Worker for JualanLab: the app (static files) and its API on one origin. Steps in ../../DEPLOY.md.
name = "jualanlab"
main = "index.ts"
compatibility_date = "2026-10-01"

# Static app built by `npm run build` into dist/. Unknown paths serve index.html (the app's own router).
[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "jualanlab"
database_id = "746fc61a-1529-456c-b655-98f2777a74a2"
migrations_dir = "../migrations"

[vars]
APP_ORIGINS = "https://jualan.untunglab.space"
GOOGLE_CLIENT_ID = ""                             # from Google Cloud Console; empty = Google sign-in off
BREVO_SENDER_EMAIL = "jualanlab@digitalsambal.space" # must be a verified sender in Brevo
BREVO_SENDER_NAME = "JualanLab"
PUBLIC_BASE_URL = "https://jualan.untunglab.space"
# Until launch (early November 2026): no new sign-ups except existing accounts and the COMP_EMAILS testers. Set to "0" at launch.
PRELAUNCH = "1"
# Prices in sen (Mamu, 9 Oct). Changing a price: edit here and push; no app update needed.
PRICE_SEN = "4900"
EARLY_BIRD_PRICE_SEN = "3900"
EARLY_BIRD_SLOTS = "15"
UNTUNGLAB_USER_PRICE_SEN = "2900"
BUNDLE_PRICE_SEN = "7500"
# ToyyibPay: same account as UntungLab, own category. Buying stays closed until TOYYIB_CATEGORY and the TOYYIB_SECRET secret are set.
TOYYIB_BASE_URL = "https://toyyibpay.com"
TOYYIB_CATEGORY = "d3wex7oj"
# UntungLab licence server (UntungLab-user price and the bundle need the UNTUNGLAB_ADMIN_TOKEN secret).
UNTUNGLAB_API = "https://beli.untunglab.space"

# Secrets (never in this file):
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put CODE_PEPPER      (any long random string)

[[routes]]
pattern = "jualan.untunglab.space"
custom_domain = true

[observability]
enabled = true
